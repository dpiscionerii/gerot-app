<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2443">
<meta name="description" content="GEROT">
<link rel="manifest" href="/gerot-app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/gerot-app/icons/icon-192.png">
<title>GEROT</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edf4ff;font-family:Arial,sans-serif}
iframe{display:block;width:100%;height:100%;border:0;background:#edf4ff}
#installGerot{position:fixed;z-index:10;right:16px;top:14px;border:0;border-radius:10px;padding:10px 14px;background:#1557a6;color:#fff;font-weight:600;box-shadow:0 3px 12px #0002;cursor:pointer;display:none}
#installGerot:hover{background:#0d4385}
</style>
</head>
<body>
<button id="installGerot" type="button">Instalar GEROT</button>
<iframe
  title="GEROT"
  src="https://script.google.com/macros/s/AKfycbw_n0vZ0-r5SvcOt0qTxEf23kvgF8BRFUbxxiokMjwCjKJsngidQ-gNZchwGv6u1a30/exec"
  allow="clipboard-read; clipboard-write"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/gerot-app/sw.js').catch(err => console.warn('GEROT SW:', err));
  });
}
let gerotInstallPrompt = null;
const installButton = document.getElementById('installGerot');
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  gerotInstallPrompt = event;
  installButton.style.display = 'block';
});
installButton.addEventListener('click', async () => {
  if (!gerotInstallPrompt) return;
  gerotInstallPrompt.prompt();
  await gerotInstallPrompt.userChoice;
  gerotInstallPrompt = null;
  installButton.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installButton.style.display = 'none';
  gerotInstallPrompt = null;
});
</script>
</body>
</html>
