<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>GEROT</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1220;
    }
    /* Recorta a barra superior do visualizador do Apps Script.
       Ajuste --crop-top se a altura da barra mudar. */
    :root { --crop-top: 44px; }
    #gerot-frame-window {
      position: fixed;
      inset: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #gerot-app {
      position: absolute;
      top: calc(-1 * var(--crop-top));
      left: 0;
      width: 100%;
      height: calc(100% + var(--crop-top));
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="gerot-frame-window">
    <iframe
      id="gerot-app"
      src="https://script.google.com/macros/s/AKfycbw_n0vZ0-r5SvcOt0qTxEf23kvgF8BRFUbxxiokMjwCjKJsngidQ-gNZchwGv6u1a30/exec?embedded=true"
      title="GEROT — Gestão de Pessoas"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
